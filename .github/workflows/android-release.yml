name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab) for Google Play'
        required: true
        type: boolean
        default: true
      build_apk:
        description: 'Build Release APK (.apk)'
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "android"
      KEY_PASSWORD: "android"
      GRADLE_OPTS: "-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8\""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Configure Keystore & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup .env from .env.example
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # 2. Provision fallback google-services.json if missing
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"862067017915","project_id":"abdelha","storage_bucket":"abdelha.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:862067017915:android:9b9abdfc9873d2c824819e","android_client_info":{"package_name":"com.aistudio.diagnostics.qxvt"}},"oauth_client":[{"client_id":"862067017915-hk577ppen0116ubjjue8q94rv3vaf0j7.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.aistudio.diagnostics.qxvt","certificate_hash":"e25aa96c7005e94e9aa0b4279d34c391a48970e0"}},{"client_id":"862067017915-k252kl4hk0m9dkl38trdto2mn98o4lil.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyCeT0O_NWxGePErRqWT_ErY5plgJekMhdo"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

          # 3. Provision debug.keystore in case debug config is validated
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 4. Configure Release Signing (custom or auto-generated self-signed upload key)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASS_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "Generating self-signed upload keystore for release..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Upload,O=AIStudio,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Build Android App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-app-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
